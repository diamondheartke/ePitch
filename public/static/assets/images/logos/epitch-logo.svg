<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon shield -->
  <polygon points="50,15 80,30 80,70 50,85 20,70 20,30" fill="#080e18" stroke="url(#pitchGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Pitch Lines inside badge -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#00ff87" stroke-width="2" opacity="0.8" />
  <line x1="20" y1="50" x2="80" y2="50" stroke="#00ff87" stroke-width="2" opacity="0.6" />
  <!-- Soccer ball element -->
  <polygon points="50,42 57,47 54,55 46,55 43,47" fill="#00ff87" />
  <!-- Text: ePITCH -->
  <text x="96" y="62" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="1">
    e<tspan fill="#00ff87">PITCH</tspan>
  </text>
  <!-- Subtitle -->
  <text x="100" y="78" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="3">
    TACTICAL ARENA // PRO
  </text>
</svg>
